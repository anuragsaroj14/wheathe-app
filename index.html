<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
#bgVideo {
    position: fixed;
    top: 0;
    left: 0;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    z-index: -2;
}

#city{
color: white;
}

.header {
    /* background: linear-gradient(135deg, #7dfff4, #8e24aa); */
    
    color: rgb(255, 255, 255);
    padding: 35px;
    border-radius: 30px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 1);
}


.weather-circle {
    width: 160px;
    height: 160px;
    background: rgba(245, 243, 243, 0.9);
    border-radius: 50%;
    box-shadow: 0 0 22px rgb(13, 17, 18);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: 0.3s;
    text-align: center;
}

.weather-circle:hover {
    transform: translateY(-10px) scale(1.05);
}

.icon {
    font-size: 34px;
}

.hot { color: gold; }
.warm { color: orange; }
.cold { color: #ddd; }

.city {
    font-size: 30px;
    font-weight: bold;
}
</style>

<script>
function getWeather() {
    let city = document.getElementById("city").value;

    let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=04b0ccfa26333b3a5efeac74b388e618&units=metric`;

    fetch(url)
    .then(res => res.json())
    .then(data => {

        let temp = data.main.temp;
        let sunClass = "warm"
        

        if (temp > 30) sunClass = "hot";
        else if (temp < 15) sunClass = "cold";

        document.getElementById("output").innerHTML = `
            <div class="city text-center text-black mb-4">${data.name}</div>

            <div class="d-flex flex-wrap justify-content-center gap-4">

                <div class="weather-circle">
                    <i class="bi bi-sun-fill icon ${sunClass}"></i>
                    <div>${temp}°C</div>
                    <small>Temperature</small>
                </div>

                <div class="weather-circle">
                    <i class="bi bi-thermometer-half icon"></i>
                    <div>${data.main.feels_like}°C</div>
                    <small>Feels Like</small>
                </div>

                <div class="weather-circle">
                    <i class="bi bi-arrow-up icon"></i>
                    <div>${data.main.temp_max}°C</div>
                    <small>Max Temp</small>
                </div>

                <div class="weather-circle">
                    <i class="bi bi-arrow-down icon"></i>
                    <div>${data.main.temp_min}°C</div>
                    <small>Min Temp</small>
                </div>

                <div class="weather-circle">
                    <i class="bi bi-droplet icon"></i>
                    <div>${data.main.humidity}%</div>
                    <small>Humidity</small>
                </div>

                <div class="weather-circle">
                    <i class="bi bi-wind icon"></i>
                    <div>${data.wind.speed} km/h</div>
                    <small>Wind Speed</small>
                </div>

                <div class="weather-circle">
                    <i class="bi bi-compass icon"></i>
                    <div>${data.wind.deg}°</div>
                    <small>Wind Direction</small>
                </div>

                <div class="weather-circle">
                    <i class="bi bi-speedometer icon"></i>
                    <div>${data.main.pressure} hPa</div>
                    <small>Pressure</small>
                </div>

                <div class="weather-circle">
                    <i class="bi bi-eye icon"></i>
                    <div>${data.visibility / 1000} km</div>
                    <small>Visibility</small>
                </div>

                <div class="weather-circle">
                    <i class="bi bi-cloud-sun icon"></i>
                    <div>${data.weather[0].description}</div>
                    <small>Condition</small>
                </div>

            </div>
        `;
    });
}
</script>
</head>

<body class="container py-4">
<video autoplay muted loop id="bgVideo">
    <source src="https://www.pexels.com/download/video/854002/" type="video/mp4">
</video>

<div class="header text-center mb-5">
    <h1 >My Weather App</h1>
    <p class="mb-3">Live weather</p>
    <div class="input-group w-75 mx-auto">
        <input type="text" id="city" class="form-control text-black " placeholder="Enter city name">
        <button onclick="getWeather()" class="btn btn-primary">
            <i class="bi bi-search"></i>
        </button>
    </div>
</div>


<div id="output"></div>

</body>
</html>
